name: agent-usage

# Manual check: the subscription usage the agent gates see (AGENT_USAGE_SNAPSHOT published
# from the owner's machine, adjusted for resets and agent runs since). Fails without one.
# Run it from the Actions tab, or: gh workflow run agent-usage.yml
on:
  workflow_dispatch:

jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Subscription usage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_USAGE_SNAPSHOT: ${{ vars.AGENT_USAGE_SNAPSHOT }}
          AGENT_PCT_PER_USD_5H: ${{ vars.AGENT_PCT_PER_USD_5H }}
          AGENT_PCT_PER_USD_7D: ${{ vars.AGENT_PCT_PER_USD_7D }}
        run: npm run -s agent:cost -- usage | tee -a "$GITHUB_STEP_SUMMARY"
