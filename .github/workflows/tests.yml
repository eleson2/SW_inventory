name: tests

# Regression gate: every PR and push to main, plus a nightly run that catches
# breakage from outside the repo (dependencies, Node, browsers).
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # SQLite: no database service needed. Paths are relative to prisma/.
  DATABASE_URL: file:./test.db
  TEST_DATABASE_URL: file:./test.db

jobs:
  unit-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx svelte-kit sync
      - name: Generate Prisma client (SQLite) and create the test database
        run: |
          npm run db:generate
          npm run db:push
      - name: Portability check
        run: npm run check:portable
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Non-blocking until the e2e specs are updated to the current UI (they predate
    # the "Add Vendor" button and clickable rows). Remove this line when they pass.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx svelte-kit sync
      - name: Generate Prisma client (SQLite)
        run: npm run db:generate
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # playwright.config.ts starts its own server on :5174 with a seeded prisma/e2e.db
      - name: E2E tests
        run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
