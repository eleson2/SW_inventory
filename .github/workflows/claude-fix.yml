name: claude-fix

# Fixer / feature builder: add the `claude-fix` label to an issue.
# It starts only if scripts/agent-cost.ts `gate` allows it:
#   - proposals need the `approved` label;
#   - otherwise the estimate's upper bound must be within AGENT_MAX_USD (repo variable,
#     default 15), or the issue has the `approved` label;
#   - the subscription must have at least 2x the expected use left in both the 5-hour
#     and the weekly window, judged from AGENT_USAGE_SNAPSHOT published from the owner's
#     machine (scripts/publish-usage.ts); fails closed without a snapshot.
# Runs on the Claude subscription only (CLAUDE_CODE_OAUTH_TOKEN); no API key is used.
# Claude works on a branch and opens a PR; nothing is merged without you.
# Afterwards the run's cost is recorded on the issue and compared with the estimate.
on:
  issues:
    types: [labeled]

# One fixer at a time, so runs after the usage snapshot are all accounted for.
# (GitHub keeps one pending run per group: re-add the label if a run was cancelled.)
concurrency:
  group: claude-fix
  cancel-in-progress: false

env:
  DATABASE_URL: file:./test.db
  TEST_DATABASE_URL: file:./test.db

jobs:
  fix:
    if: github.event.label.name == 'claude-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      AGENT_USAGE_SNAPSHOT: ${{ vars.AGENT_USAGE_SNAPSHOT }}
      AGENT_PCT_PER_USD_5H: ${{ vars.AGENT_PCT_PER_USD_5H }}
      AGENT_PCT_PER_USD_7D: ${{ vars.AGENT_PCT_PER_USD_7D }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - name: Cost / approval / subscription headroom gate
        id: gate
        run: |
          if npm run -s agent:cost -- gate --issue "$ISSUE" --max-usd "${{ vars.AGENT_MAX_USD || '15' }}" --headroom --post; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            gh issue edit "$ISSUE" --remove-label claude-fix
          fi

      - name: Prepare test environment
        if: steps.gate.outputs.ok == 'true'
        run: |
          npx svelte-kit sync
          npm run db:generate
          npm run db:push

      - name: Fix
        id: claude
        if: steps.gate.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude-fix
          claude_args: >-
            --max-turns 80
            --allowedTools Read,Glob,Grep,Edit,Write,Bash(npm run:*),Bash(npx vitest:*),Bash(npx svelte-kit:*),Bash(npx tsx:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr create:*)
            --append-system-prompt "Resolve the issue you were triggered on. Follow CLAUDE.md (portability rules, #lib imports with extensions, schema changes only in prisma/schema.prisma). For a bug: first write a regression test that fails, then fix it. For a feature: add unit and integration tests. Keep the change limited to the issue. Before finishing run npm run check:portable, npm run test:unit and npm run test:integration (SQLite test DB is ready) and make them pass. Never push to main: work on your branch and open a pull request whose body contains 'Fixes #<issue>' and a short summary of the change and the tests. If the issue is unclear or much bigger than its estimate, stop and explain in the issue instead."

      - name: Record cost and compare with the estimate
        if: always() && steps.claude.outputs.execution_file != ''
        run: |
          npm run -s agent:cost -- record "${{ steps.claude.outputs.execution_file }}" --issue "$ISSUE" --agent fixer --post
          npm run -s agent:cost -- summary --issue "$ISSUE" --post
